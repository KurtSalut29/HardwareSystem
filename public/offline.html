<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#1E4FD8">
  <title>You're offline — RM Hardware</title>
  <style>
    :root { --bg: #F5F7FC; --card: #FFFFFF; --ink: #0F172A; --ink-3: #5B6478; --line: #E3E8F2; --brand: #1E4FD8; --brand-soft: #EEF3FE; }
    @media (prefers-color-scheme: dark) {
      :root { --bg: #0B1020; --card: #131A2E; --ink: #E8ECF6; --ink-3: #9AA4BC; --line: #232C45; --brand: #6089FF; --brand-soft: #182246; }
    }
    * { box-sizing: border-box; }
    html, body { height: 100%; margin: 0; }
    body { display: grid; place-items: center; padding: 16px; background: var(--bg); color: var(--ink);
      font-family: Inter, system-ui, -apple-system, "Segoe UI", Roboto, Arial, sans-serif; }
    .card { width: 100%; max-width: 380px; padding: 32px 24px 24px; text-align: center; background: var(--card);
      border: 1px solid var(--line); border-radius: 24px; box-shadow: 0 18px 40px -24px rgba(16, 24, 64, .35); }
    img { width: 72px; height: 72px; object-fit: contain; }
    .brand { margin: 8px 0 0; font-size: 20px; font-weight: 800; letter-spacing: -.01em; }
    .chip { display: inline-flex; align-items: center; gap: 6px; margin-top: 20px; padding: 6px 12px; border-radius: 999px;
      background: var(--brand-soft); color: var(--brand); font-size: 12px; font-weight: 700; }
    .dot { width: 7px; height: 7px; border-radius: 50%; background: currentColor; }
    h1 { margin: 14px 0 6px; font-size: 22px; letter-spacing: -.01em; }
    p { margin: 0; font-size: 14px; line-height: 1.55; color: var(--ink-3); }
    button { margin-top: 22px; width: 100%; height: 46px; border: 0; border-radius: 14px; background: var(--brand); color: #fff;
      font: inherit; font-size: 15px; font-weight: 700; cursor: pointer; }
    button:focus-visible { outline: 3px solid var(--brand-soft); outline-offset: 2px; }
  </style>
</head>
<body>
  <main class="card">
    <img src="/icons/icon-192.png" alt="">
    <p class="brand">RM Hardware</p>
    <span class="chip"><span class="dot"></span> No internet connection</span>
    <h1>You're offline</h1>
    <p>Orders, stock and prices need a connection. Check your Wi-Fi or mobile data, then try again.</p>
    <button type="button" onclick="location.reload()">Try again</button>
  </main>
  <script>window.addEventListener("online", function () { location.reload(); });</script>
</body>
</html>
